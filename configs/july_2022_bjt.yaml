# v0.3: full-month July 2022 case study, Beijing-time (UTC+8) days.
#
# Run with:
#     python -m src.pipeline --config configs/july_2022_bjt.yaml

name: july_2022_bjt

period:
  start: "2022-07-01"
  end: "2022-07-31"

# East China sample domain (degrees). CDS "area" order is [north, west, south, east].
region:
  north: 36
  west: 112
  south: 25
  east: 123

# Daily values are calendar days in this time zone, as hours from UTC
# (ERA5 timestamps are UTC). Beijing time is UTC+8 (no daylight saving):
# Beijing day D runs from 16:00 UTC on D-1 to 15:00 UTC on D, so the raw
# file also holds the last 8 UTC hours of the day before the period.
# It is a different file from the UTC config's: never mix the two.
utc_offset_hours: 8

# City points are compared at the nearest ERA5 grid point.
cities:
  - {name: Nanjing,  lat: 32.06, lon: 118.79, color: "#d62728"}
  - {name: Shanghai, lat: 31.23, lon: 121.47, color: "#1f77b4"}
  - {name: Hangzhou, lat: 30.27, lon: 120.15, color: "#2ca02c"}
  - {name: "Huai'an", lat: 33.61, lon: 119.02, color: "#ff7f0e"}

# Risk area fractions count land grid cells only. ERA5 "land_sea_mask" is
# the fraction of land in each grid cell (0 = sea, 1 = land); a cell is
# land where it is >= this threshold. Maps grey out the other (sea) cells.
land_sea_mask_threshold: 0.5

# Suffix used in every data and figure file name of this run. It differs
# from the UTC config's, so no raw or processed file is shared.
file_tag: "2022_07_bjt"

# Where this run's figures are written (relative to the project root).
figures_dir: figures/v0.3_july_2022_bjt
